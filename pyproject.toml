[project]
name = "general-agent"
version = "0.1.0"
description = "本机个人对话智能体"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.27,<1",
  "python-multipart==0.0.32",
  "pypdf==6.20.1",
  "python-docx==1.2.0",
  "pillow==12.3.0",
  "tokenizers>=0.22,<1",
  "langgraph>=1,<2",
  "langsmith>=0.14,<1",
  "langgraph-checkpoint-postgres>=3,<4",
  "argon2-cffi>=23,<26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "mypy>=1.11,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "tests"]
