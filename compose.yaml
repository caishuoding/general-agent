name: general-agent
services:
  db:
    image: general-agent-postgres:17-vector0.8.7
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: general_agent
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: general_agent
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U general_agent -d general_agent"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
