name: general-agent
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: general_agent
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: general_agent
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U general_agent -d general_agent"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
