name: general-agent
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: general_agent
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: general_agent
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U general_agent -d general_agent"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://general_agent:local-development-only@db:5432/general_agent
      MEM0_API_URL: http://mem0:8000
      APP_DATA_DIR: /app/.local
      PUBLIC_HOST: ${PUBLIC_HOST:-101.37.161.159}
      COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.local:/app/.local
    networks:
      - default
      - mem0
volumes:
  postgres_data:
networks:
  mem0:
    external: true
    name: general-agent-mem0
